<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>La Cazuela — Carta digital</title>
  <meta name="description" content="Carta digital de La Cazuela, cocina mediterránea de barrio.">
  <meta name="theme-color" content="#b5502f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="cabecera">
    <div class="cabecera__contenido">
      <h1 class="cabecera__nombre">La Cazuela</h1>
      <p class="cabecera__eslogan">Cocina mediterránea de barrio</p>
    </div>
  </header>

  <nav class="categorias" id="nav-categorias" aria-label="Categorías de la carta">
    <!-- Los botones de categoría se generan automáticamente -->
  </nav>

  <main id="contenido-carta" class="carta">
    <p class="carta__cargando">Cargando la carta...</p>
  </main>

  <footer class="pie">
    <p id="pie-aviso" class="pie__aviso"></p>
    <p class="pie__marca">La Cazuela</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
